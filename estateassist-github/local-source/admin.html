<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EstateAssist local admin</title><style>
body{font:16px/1.5 system-ui,sans-serif;background:#f5f2eb;color:#183d31;margin:0}main{max-width:1050px;margin:40px auto;padding:0 20px}h1{font-size:2.3rem}.notice{background:#fff4d8;padding:14px;border-left:4px solid #c38a36}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{background:white;padding:20px;border-radius:8px;margin:12px 0;overflow-wrap:anywhere}.meta{color:#65766f;font-size:.9rem}button{padding:8px 12px;background:#183d31;color:white;border:0;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main><p><a href="/">← EstateAssist demo</a></p><h1>Local admin queue</h1><p id="mode" class="notice">Loading…</p><div class="grid"><section><h2>Leads</h2><div id="leads"></div></section><section><h2>Human follow-up</h2><div id="handoffs"></div></section></div></main><script>
async function load(){const r=await fetch('/api/admin');const d=await r.json();document.querySelector('#mode').textContent=d.mode+' · Fictional demo knowledge only. Stored locally on this computer.';document.querySelector('#leads').innerHTML=d.leads.length?d.leads.map(x=>`<article class="card"><b>${esc(x.intent)}${x.name?' · '+esc(x.name):''}</b><p>${esc(x.location||'')} ${esc(x.budget||'')} ${esc(x.propertyType||'')}</p><p>${esc(x.contact)}</p><p class="meta">${esc(x.createdAt)}</p></article>`).join(''):'<p>No saved leads yet.</p>';document.querySelector('#handoffs').innerHTML=d.handoffs.length?d.handoffs.map(x=>`<article class="card"><b>${esc(x.status)} · ${esc(x.intent)}</b><p>${esc(x.question||x.summary)}</p><p class="meta">${esc(x.createdAt)}</p>${x.status==='open'?`<button onclick="resolveItem('${x.id}')">Mark resolved</button>`:''}</article>`).join(''):'<p>No handoffs waiting.</p>'}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function resolveItem(id){await fetch('/api/handoffs/'+id+'/resolve',{method:'POST'});load()}load();setInterval(load,8000);
</script></body></html>
